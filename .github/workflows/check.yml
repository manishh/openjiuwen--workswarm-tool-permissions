name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live demo (starts the WorkSwarm backend; no API key needed)"
        type: boolean
        default: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WorkSwarm 0.2.7
        run: pip install -r requirements.txt
      - name: Offline check (real permission engine, no backend, no model)
        run: python demo/check_policy.py

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WorkSwarm 0.2.7
        run: pip install -r requirements.txt
      - name: Live demo (real WorkSwarm backend, scripted model)
        run: python demo/run_demo.py --repeat 2
      - name: Keep the run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: runs/**/report.json
